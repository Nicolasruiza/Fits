<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f3">
<title>Fits · Look</title>
<style>
:root{--bg:#ecefed;--paper:#fbfbf8;--ink:#142238;--muted:#6f777d;--line:#dde1df;--navy:#173d65;--navy2:#102d4d;--chip:#f0f1ef;--owned:#e6eee7;--ownedInk:#395842;--warn:#f2e6df;--warnInk:#825a49;--shadow:0 14px 36px rgba(24,36,46,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{display:flex;justify-content:center}.app{width:min(100%,430px);min-height:100vh;background:linear-gradient(180deg,#fafaf7,#f1f3f1);padding-bottom:88px}.top{position:sticky;top:0;z-index:20;background:rgba(250,250,247,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(221,225,223,.8);padding:12px 14px 10px}.toprow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.iconbtn{width:38px;height:38px;border:0;border-radius:999px;background:transparent;color:var(--ink);font-size:24px;display:grid;place-items:center}.title{font:700 23px Georgia,serif;text-align:center;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bookmark{font-size:22px}.weather{margin-top:9px;background:linear-gradient(135deg,#f0f0ec,#e7e8e5);border:1px solid var(--line);border-radius:16px;padding:9px 8px}.weather-row{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.wx{position:relative;text-align:center;padding:2px 4px}.wx:not(:last-child):after{content:"";position:absolute;right:-2px;top:5px;bottom:5px;width:1px;background:#d2d6d4}.wx .t{font-size:9px;color:var(--muted)}.wx .ico{font-size:20px;line-height:1;margin:4px 0}.wx .deg{font-size:17px;font-weight:700}.weather-note{text-align:center;font-size:10px;color:var(--muted);margin-top:7px}main{padding:12px 13px 18px}.hero{height:535px;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#c9cecd,#e6e9e7);box-shadow:var(--shadow);position:relative}.hero img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}.hero.empty{display:grid;place-items:center}.placeholder{width:92px;height:230px;border-radius:40px 40px 18px 18px;background:linear-gradient(#253b55 0 37%,#384452 37% 77%,#f0efea 77%);box-shadow:0 12px 25px rgba(0,0,0,.12)}.statusrow{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:12px 0}.statusrow::-webkit-scrollbar{display:none}.status{white-space:nowrap;background:var(--chip);border:1px solid #e6e8e6;border-radius:999px;padding:8px 11px;font-size:10px;display:flex;align-items:center;gap:6px}.status.good{background:#e5eee7;color:#365742}.status.caution{background:var(--warn);color:var(--warnInk)}.actions{display:grid;grid-template-columns:1.2fr .9fr;gap:9px;margin:4px 0 18px}.btn{border-radius:14px;padding:13px 10px;font-size:12px;font-weight:700;border:1px solid var(--navy);background:#fff;color:var(--navy)}.btn.primary{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.btn.saved{background:#e8eef3}.section{margin-top:19px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:9px}.section h2{font:700 22px Georgia,serif;margin:0}.sectionhead span{font-size:9px;color:var(--muted)}.pieces{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}.piece{display:grid;grid-template-columns:58px 1fr auto 18px;align-items:center;gap:9px;padding:10px 11px;border-bottom:1px solid var(--line)}.piece:last-child{border-bottom:0}.piece-thumb{width:52px;height:52px;border-radius:12px;background:#f0f1ee;display:grid;place-items:center}.piece-shape{width:30px;height:32px;border-radius:9px;background:var(--swatch,#303a45);box-shadow:inset 0 0 0 1px #0000000c}.piece strong{display:block;font-size:12px}.piece small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.own{font-size:9px;padding:6px 8px;border-radius:999px;background:var(--owned);color:var(--ownedInk)}.own.missing{background:#f2e2dd;color:#814f44}.own.unsure{background:#eee8d9;color:#735f38}.chev{color:#7c858b;font-size:20px}.variants{display:flex;gap:9px;overflow:auto;padding-bottom:3px;scrollbar-width:none}.variants::-webkit-scrollbar{display:none}.variant{min-width:170px;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:7px}.variant.active{border:2px solid var(--navy);padding:6px}.variant-media{height:138px;border-radius:11px;overflow:hidden;background:#d7dcda;display:grid;place-items:center}.variant-media img{width:100%;height:100%;object-fit:cover}.variant .vname{font-size:11px;font-weight:700;margin:7px 2px 0}.variant .vdiff{font-size:8px;color:var(--muted);margin:3px 2px 2px}.wearmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.meta{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px}.meta b{display:block;font-size:16px}.meta span{font-size:9px;color:var(--muted)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:74px;background:#f8f8f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:30}.nav a{color:#7a8287;text-decoration:none;text-align:center;font-size:10px;min-width:82px}.nav b{display:block;font-size:20px;margin-bottom:3px}.nav a.active{color:var(--navy)}.notice{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--muted);font-size:11px;line-height:1.45}
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script>
(function(){
const DATA=window.FITS_DATA;
const imageMap={
 'look-01':'assets/look-green-khaki-v2.webp?v=8',
 'look-02':'assets/look-burgundy-charcoal-v1.webp?v=8',
 'look-03':'assets/look-white-navy-sneakers.webp?v=8',
 'look-04':'assets/look-navy-grey-loafers.webp?v=8',
 'look-08':'assets/look-navy-blazer-grey.webp?v=8',
 'look-09':'assets/look-charcoal-lightgrey-v1.webp?v=8'
};
const swatches={
 'green-polo':'#315b43','burgundy-polo':'#743e49','white-polo':'#f5f4ef','navy-polo':'#263b55','charcoal-polo':'#4f5254',
 'khaki-chinos':'#b7a68c','charcoal-trousers':'#4b4e51','navy-trousers':'#283b50','grey-trousers':'#a9adae','taupe-trousers':'#aa9b86','light-grey-trousers':'#c7c9c8','dark-denim':'#29384a',
 'brown-loafers':'#624532','brown-derbies':'#6e4d38','dark-loafers':'#35312f','brown-casual-shoes':'#74533f','white-leather-sneakers':'#f0efeb','brown-belt':'#684832','dark-belt':'#38332f','navy-blazer':'#213650'
};
function safe(key,fallback){try{const x=localStorage.getItem(key);return x?JSON.parse(x):fallback}catch(e){return fallback}}
const defaults=Object.fromEntries(DATA.pieces.map(p=>[p.id,p.status]));
let wardrobe=safe('fitsWardrobe',defaults), wear=safe('fitsWearHistory',{}), saved=safe('fitsSavedVariants',{});
const q=new URLSearchParams(location.search);
const fam=DATA.families.find(f=>f.id===q.get('family'))||DATA.families[0];
const looks=fam.looks.map(id=>DATA.looks.find(l=>l.id===id)).filter(Boolean);
let active=DATA.looks.find(l=>l.id===q.get('look'))||DATA.looks.find(l=>l.id===fam.hero)||looks[0];
const piece=id=>DATA.pieces.find(p=>p.id===id);
function imageFor(l){return imageMap[l.id]||null}
function icon(code){if(code===0)return'☀️';if(code<=2)return'🌤️';if(code===3)return'☁️';if(code===45||code===48)return'🌫️';if((code>=51&&code<=67)||(code>=80&&code<=82))return'🌧️';if(code>=71&&code<=86)return'❄️';if(code>=95)return'⛈️';return'☁️'}
function currentWeather(){let w=safe('fitsWeatherHome',null);if(w&&Date.now()-w.ts<3600000)return w;const old=safe('fitsWeather',null);if(old&&Date.now()-old.ts<3600000)return{temp:old.t,currentRain:old.rainy,maxRain:old.rainy?100:0,hours:[]};return null}
function fit(w){if(!w)return{level:'neutral',label:'Weather pending',reason:'Enable weather on Looks for live suggestions.'};const names=active.pieces.map(id=>(piece(id)?.name||'').toLowerCase()).join(' '),t=Math.round(w.temp),rain=w.currentRain||w.maxRain>=40,outer=/blazer|jacket|vest|coat|sweater|cardigan/.test(names),dress=/loafer|derbies|dress shoe/.test(names),sneakers=/sneaker/.test(names);if(t>=25&&outer)return{level:'caution',label:'Might feel warm',reason:'Extra layer may feel heavy.'};if(t<=12&&!outer)return{level:'caution',label:'Could feel cool',reason:'Consider a light layer.'};if(rain&&dress&&!sneakers)return{level:'caution',label:'Weather note',reason:'Rain may make dress shoes less practical.'};if(t>=22&&!outer)return{level:'good',label:'Great today',reason:'Lighter pieces suit the temperature.'};if(rain&&sneakers)return{level:'good',label:'Good today',reason:'Sneakers are more forgiving if rain shows up.'};return{level:'neutral',label:'Could work',reason:'Weather should not be a major issue.'}}
function weatherHTML(w){if(!w)return`<div class="weather"><div class="weather-note">Weather unavailable · enable location on Looks for hourly suggestions.</div></div>`;let hs=(w.hours||[]).slice(0,4);if(!hs.length)hs=[{label:'Now',temp:w.temp,rain:w.maxRain||0,code:w.code||2}];return`<div class="weather"><div class="weather-row">${hs.map((h,i)=>`<div class="wx"><div class="t">${i===0?'Now':h.label}</div><div class="ico">${icon(h.code||2)}</div><div class="deg">${Math.round(h.temp)}°</div></div>`).join('')}</div><div class="weather-note">${fit(w).reason}</div></div>`}
function statusLabel(st){return st==='owned'?'Owned':st==='missing'?'Missing':'Unsure'}
function variantDiff(v){if(v.id===looks[0].id)return'Base look';const b=looks[0],add=v.pieces.filter(x=>!b.pieces.includes(x)).map(x=>piece(x)?.name).filter(Boolean),rem=b.pieces.filter(x=>!v.pieces.includes(x)).map(x=>piece(x)?.name).filter(Boolean);if(add.length===1&&rem.length===1)return`${rem[0]} → ${add[0]}`;if(add.length===1)return`Add ${add[0]}`;return v.name}
function count(){return(wear[active.id]||[]).length}function last(){const h=wear[active.id]||[];return h.length?new Date(h[h.length-1]+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'Never'}
window.wearToday=function(){const d=new Date().toISOString().slice(0,10);wear[active.id]=wear[active.id]||[];if(!wear[active.id].includes(d))wear[active.id].push(d);localStorage.setItem('fitsWearHistory',JSON.stringify(wear));render()}
window.toggleSaved=function(){saved[active.id]=!saved[active.id];localStorage.setItem('fitsSavedVariants',JSON.stringify(saved));render()}
function render(){const w=currentWeather(), f=fit(w), img=imageFor(active), wornToday=(wear[active.id]||[]).includes(new Date().toISOString().slice(0,10));document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="toprow"><button class="iconbtn" onclick="history.back()">‹</button><div class="title">${fam.name.replace(' polo','').replace(' trousers','')}</div><button class="iconbtn bookmark" onclick="toggleSaved()">${saved[active.id]?'★':'☆'}</button></div>${weatherHTML(w)}</header><main><div class="hero ${img?'':'empty'}">${img?`<img src="${img}" alt="${active.name}">`:'<div class="placeholder"></div>'}</div><div class="statusrow"><span class="status ${f.level}">${f.level==='good'?'☀':'◌'} ${f.label}</span>${active.badges.map(x=>`<span class="status">${x}</span>`).join('')}</div><div class="actions"><button class="btn primary" onclick="wearToday()">${wornToday?'✓ Worn today':'I’ll wear this'}</button><button class="btn ${saved[active.id]?'saved':''}" onclick="toggleSaved()">${saved[active.id]?'Saved ✓':'Save variant'}</button></div>${looks.length>1?`<section class="section"><div class="sectionhead"><h2>Variants</h2><span>${looks.length} real combinations</span></div><div class="variants">${looks.map(v=>`<a class="variant ${v.id===active.id?'active':''}" href="detail.html?family=${fam.id}&look=${v.id}"><div class="variant-media">${imageFor(v)?`<img src="${imageFor(v)}" alt="${v.name}">`:'<div class="placeholder" style="transform:scale(.55)"></div>'}</div><div class="vname">${v.name}</div><div class="vdiff">${variantDiff(v)}</div></a>`).join('')}</div></section>`:''}<section class="section"><div class="sectionhead"><h2>Items in this look</h2><span>${active.pieces.length} pieces</span></div><div class="pieces">${active.pieces.map(id=>{const p=piece(id),st=wardrobe[id]||p.status||'unsure';return`<div class="piece"><div class="piece-thumb"><div class="piece-shape" style="--swatch:${swatches[id]||'#65707a'}"></div></div><div><strong>${p.name}</strong><small>${p.category}</small></div><span class="own ${st}">${statusLabel(st)}</span><span class="chev">›</span></div>`}).join('')}</div><div class="wearmeta"><div class="meta"><b>${count()}×</b><span>Worn</span></div><div class="meta"><b>${last()}</b><span>Last worn</span></div></div></section></main><nav class="nav"><a class="active" href="index.html"><b>▦</b>Looks</a><a href="wardrobe.html"><b>◇</b>Wardrobe</a><a href="unlock.html"><b>↗</b>Unlock</a></nav></div>`}
render();
})();
</script>
</body>
</html>
