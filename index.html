  <title>Fits</title>
  <script>
    // GitHub Pages may serve a stale cached entry document on repeat visits.
    // Give the entry URL a daily cache key while preserving existing query parameters.
    (() => {
      // Keep one public address while GitHub Pages remains the deployment origin.
      if (window.location.hostname === 'nicolasruiza.github.io') {
        const canonical = new URL('https://nicolasruiz.net/fits');
        canonical.search = window.location.search;
        canonical.hash = window.location.hash;
        window.location.replace(canonical.toString());
        return;
      }
      // UI switch (A/B): ?ui=v5 or ?ui=classic is remembered on this device.
      // DEFAULT_UI applies to anyone who has not chosen yet.
      const DEFAULT_UI='v5';
      const chosen=new URL(window.location.href).searchParams.get('ui');
      if(chosen==='v5'||chosen==='classic'){try{localStorage.setItem('fitsUI',JSON.stringify(chosen))}catch(e){}}
      let ui=DEFAULT_UI;
      try{const saved=JSON.parse(localStorage.getItem('fitsUI')||'null');if(saved==='v5'||saved==='classic')ui=saved}catch(e){}
      if(ui==='v5'){window.location.replace('looks.html');return}
      const url = new URL(window.location.href);
      if (!url.searchParams.has('entry')) {
        const now = new Date();
        const day = [now.getUTCFullYear(), String(now.getUTCMonth() + 1).padStart(2, '0'), String(now.getUTCDate()).padStart(2, '0')].join('');
        url.searchParams.set('entry', day);
        window.location.replace(url.toString());
      }
    })();
  </script>
