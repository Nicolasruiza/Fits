<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202428"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fits"><link rel="manifest" href="manifest.webmanifest?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><title>Fits</title><link rel="stylesheet" href="styles.css?v=2"><link rel="stylesheet" href="weather-v3.css?v=2"></head><body data-page="looks"><div id="boot" style="max-width:430px;margin:0 auto;min-height:100vh;background:#eef0ef;color:#202428;padding:28px 18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><div style="font:700 34px Georgia,serif">Fits</div><div style="margin-top:8px;font-size:13px;color:#6d7175">Loading your wardrobe…</div></div><script>try{['fitsWardrobe','fitsCustomPieces','fitsWearHistory','fitsWeather'].forEach(function(k){var v=localStorage.getItem(k);if(v){JSON.parse(v)}})}catch(e){localStorage.removeItem('fitsWardrobe');localStorage.removeItem('fitsCustomPieces');localStorage.removeItem('fitsWearHistory');localStorage.removeItem('fitsWeather')}if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}</script><script src="data.js?v=2"></script><script src="app.js?v=2"></script><script src="weather-v3.js?v=2"></script><script>setTimeout(function(){var b=document.getElementById('boot');if(b){b.innerHTML='<div style="font:700 34px Georgia,serif">Fits</div><div style="margin-top:12px;font-size:14px">Fits could not start.</div><button onclick="location.reload(true)" style="margin-top:14px;border:0;border-radius:999px;background:#202428;color:white;padding:10px 14px">Reload</button>'}},3000)</script></body></html>
