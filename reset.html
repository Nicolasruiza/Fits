<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20262a"><title>Reset Fits</title><style>html,body{margin:0;background:#eef0ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20262a}main{max-width:430px;margin:0 auto;min-height:100vh;padding:32px 20px;background:#f6f7f6}.brand{font:700 34px Georgia,serif}.msg{margin-top:10px;font-size:14px;color:#687176}.ok{margin-top:18px;padding:14px;border-radius:14px;background:#fff;border:1px solid #d6d9d8;font-size:13px}</style></head><body><main><div class="brand">Fits</div><div class="msg">Refreshing the app…</div><div class="ok" id="status">Clearing old cache and app data.</div></main><script>(async function(){try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}try{localStorage.removeItem('fitsWeather');}catch(e){}document.getElementById('status').textContent='Done. Opening a clean copy…';setTimeout(()=>{location.replace('./?clean='+Date.now())},500);}catch(e){document.getElementById('status').textContent='Reset finished with a warning. Opening Fits…';setTimeout(()=>{location.replace('./?clean='+Date.now())},800);}})();</script></body></html>
